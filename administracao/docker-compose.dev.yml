# ============================================================================
# Docker Compose for Development Environment
# Simplified version with hot-reload and debug tools
# ============================================================================

version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: agendeaqui_dev_db
    environment:
      POSTGRES_DB: agendeaqui_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - agendeaqui_dev_network

  redis:
    image: redis:7-alpine
    container_name: agendeaqui_dev_redis
    ports:
      - "6380:6379"
    networks:
      - agendeaqui_dev_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendeaqui_dev_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agendeaqui_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      - db
      - redis
    networks:
      - agendeaqui_dev_network

volumes:
  postgres_dev_data:

networks:
  agendeaqui_dev_network:
    driver: bridge
