{% extends 'base.html' %}
{% load static %}

{% block title %}Nova Senha - AgendeAqui{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .reset-container {
        max-width: 450px;
        width: 100%;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .reset-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .reset-header h1 {
        font-size: 28px;
        color: #0f172a;
        margin-bottom: 10px;
    }
    
    .form-control {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 15px;
    }
    
    .btn-submit {
        width: 100%;
        padding: 14px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <div class="reset-header">
        <h1>🔐 Definir Nova Senha</h1>
        <p>Crie uma senha forte e segura</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">
            ✓ Redefinir Senha
        </button>
    </form>
</div>
{% endblock %}
