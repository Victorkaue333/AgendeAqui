{% extends 'base.html' %}

{% block title %}Senha Redefinida - AgendeAqui{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .success-container {
        max-width: 500px;
        width: 100%;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        text-align: center;
    }
    
    .icon {
        font-size: 64px;
        margin-bottom: 20px;
    }
    
    h1 {
        font-size: 24px;
        color: #0f172a;
        margin-bottom: 15px;
    }
    
    .btn-login {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 30px;
        background: #6366f1;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="success-container">
    <div class="icon">✅</div>
    <h1>Senha Redefinida com Sucesso!</h1>
    <p>Sua senha foi alterada. Você já pode fazer login com sua nova senha.</p>
    <a href="{% url 'login' %}" class="btn-login">Fazer Login</a>
</div>
{% endblock %}
